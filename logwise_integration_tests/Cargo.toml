[package]
name = "logwise_integration_tests"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "cross-package acceptance tests for logwise"
publish = false
rust-version = "1.95.0"

[dependencies]
logwise = { path = ".." }
logwise_runtime = { path = "../logwise_runtime" }
logwise_runtime_wasm = { path = "../logwise_runtime_wasm" }
some_executor = { git = "ssh://gitea@gitea.mermaid-gecko.ts.net/Metropolis/some_executor.git", rev = "45b02a16c410405867c6770144ae3168b58c532e", features = [
    "logwise-diagnostic",
    "logwise-forensic",
    "logwise-performance",
] }
# `block_on` drives the raw-executor case in `tests/executor_context.rs`, and
# `wasm_lite_std as thread` gives that file a `spawn` on wasm32. Both targets
# need it, so it is not under the `cfg` below.
wasm_lite_std = "0.1.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Where the tests get `#[wasm_lite_test]`. Off wasm32 the `cfg_attr` holding
# that attribute is false and the cases are plain `#[test]`s, so nothing there
# needs the crate.
wasm_lite = "0.1.2"
