[package]
name = "logwise"
version = "0.7.0"
authors = ["Drew Crawford <drew@sealedabstract.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "a zero-dependency structured observability facade"
homepage = "https://sealedabstract.com/code/logwise"
repository = "https://github.com/drewcrawford/logwise"
keywords = ["logging", "observability"]
categories = ["development-tools::debugging", "no-std"]
rust-version = "1.95.0"
exclude = [".*"]

[workspace]
resolver = "3"
members = [
    ".",
    "logwise_integration_tests",
    "logwise_compat_log",
    "logwise_compat_tracing",
    "logwise_runtime",
    "logwise_runtime/logwise_runtime_proc",
    "logwise_runtime_wasm",
]
exclude = ["fixtures/no_std_no_alloc"]

# The cross-package acceptance crate follows the coordinated pre-release pins
# used by the executor crates. Keep their facade edge pointed at this checkout
# so every test observes the one installed dispatcher.
[patch."ssh://gitea@gitea.mermaid-gecko.ts.net/Metropolis/logwise.git"]
logwise = { path = "." }

[dependencies]

[features]
default = []
alloc = []
std = ["alloc"]
