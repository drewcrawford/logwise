[package]
name = "logwise"
version = "0.6.0"
authors = ["Drew Crawford <drew@sealedabstract.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "an opinionated logging library for Rust"
homepage = "https://sealedabstract.com/code/logwise"
repository = "https://github.com/drewcrawford/logwise"
keywords = ["logging"]
categories = ["development-tools::debugging", "development-tools::profiling"]
rust-version = "1.85.1"

exclude = [".*"]

[dependencies]
logwise_proc = { path = "logwise_proc", version = "0.5.0" }
# Taken from the registry, not by path: a published crate may not carry a path
# dependency without a version, and a path pointing outside this checkout would
# not survive packaging anyway. The [patch.crates-io] block below redirects this
# to ../wasm_lite for the dev cycle, which is what keeps the graph on one copy.
wasm_lite_std = "0.1.1"

[dev-dependencies]
# Range, not "0.5": dev-dependency cycle. test_executors depends on logwise, so
# it cannot publish 0.5.0 until logwise 0.6.0 is on crates.io -- while
# `cargo publish` insists every dev-dependency resolve from the registry, and
# ignores [patch] when doing so. A range accepts the published 0.4.1 at publish
# time and the patched local 0.5.0 during development.
test_executors = ">=0.4.1, <0.6"

[features]
logwise_internal = []

[target.'cfg(target_arch="wasm32")'.dependencies]
# Registry dependency for the same reason as wasm_lite_std above; the patch
# below points it at the local checkout during development.
wasm_lite = "0.1.1"


[target.'cfg(target_arch="wasm32")'.dev-dependencies]
# for print_demo

[[test]]
name = "wasm_stderr_logger"
path = "tests/wasm_stderr_logger.rs"
harness = false

# Dev-cycle self-patch: the published test_executors expands #[async_test] to
# #[wasm_bindgen_test], so without this the wasm32 test target does not compile
# here. The Instant flag-day is all-or-nothing, hence some_executor too.
[patch.crates-io]
test_executors = { path = "../test_executors" }
some_executor = { path = "../some_executor" }
# `continue` is reached via some_executor and needs no patch: 0.1.3 dropped
# wasm-bindgen and takes wasm_lite only as a dev-dependency, which does not
# reach us. Re-add a patch here only if a future release puts it back on a
# wasm32 *normal* dependency.
# test_executors depends on logwise, so without this the dev-cycle pulls the
# *registry* logwise -- which still uses wasm_safe_thread/web-sys -- back in.
logwise = { path = "." }
# Same trap one level down: we take wasm_lite by path, but some_executor and
# test_executors take it from the registry. wasm_lite exports #[no_mangle]
# symbols (__wl_thread_entry, __wl_closure_call_0, ...), so two copies in one
# graph is not a silent duplicate -- every wasm32 test binary fails to link
# with "duplicate symbol". Patch both so the whole graph shares one copy.
wasm_lite = { path = "../wasm_lite/crates/wasm_lite" }
wasm_lite_std = { path = "../wasm_lite/crates/wasm_lite_std" }
