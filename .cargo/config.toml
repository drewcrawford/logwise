[unstable]
build-std = ["std", "panic_abort"]

[target.'cfg(target_arch="wasm32")']
runner = "wasm_lite run"
rustflags = ["-C", "target-feature=+atomics",
    # see https://github.com/wasm-bindgen/wasm-bindgen/issues/4727
    # and


    "-Clink-arg=--shared-memory",
    # 4GB
    "-Clink-arg=--max-memory=4294967296",
    "-Clink-arg=--import-memory",
    "-Clink-arg=--export=__wasm_init_tls",
    # wasm_lite's worker bootstrap reads this to place each worker's stack.
    "-Clink-arg=--export=__stack_pointer",
    "-Clink-arg=--export=__tls_size",
    "-Clink-arg=--export=__tls_align",
    "-Clink-arg=--export=__tls_base",
    # Newer nightlies no longer export this by default; wasm-bindgen's threading
    # transform needs it, and without it the test runner fails with
    # "failed to find `__heap_base` for injecting thread id"
    "-Clink-arg=--export=__heap_base",
    # Workaround for wasm-bindgen duplicate function declarations with v0 mangling
    # see https://github.com/rustwasm/wasm-bindgen/issues/4820
    "-Csymbol-mangling-version=legacy",
    "-Zunstable-options",
]

# Note: cfg() predicates do not apply to rustdoc flags, so use the exact
# triple target section for doctests.
[target.wasm32-unknown-unknown]
rustdocflags = ["-C", "target-feature=+atomics",
    "-Clink-arg=--shared-memory",
    "-Clink-arg=--max-memory=4294967296",
    "-Clink-arg=--import-memory",
    "-Clink-arg=--export=__wasm_init_tls",
    # wasm_lite's worker bootstrap reads this to place each worker's stack.
    "-Clink-arg=--export=__stack_pointer",
    "-Clink-arg=--export=__tls_size",
    "-Clink-arg=--export=__tls_align",
    "-Clink-arg=--export=__tls_base",
    # Newer nightlies no longer export this by default; wasm-bindgen's threading
    # transform needs it, and without it the test runner fails with
    # "failed to find `__heap_base` for injecting thread id"
    "-Clink-arg=--export=__heap_base",
    "-Csymbol-mangling-version=legacy",
    "-Zunstable-options",
]
