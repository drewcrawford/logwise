[package]
name = "logwise_compat_log"
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Privacy-conservative log facade ingestion for logwise"
homepage = "https://sealedabstract.com/code/logwise"
repository = "https://github.com/drewcrawford/logwise"
keywords = ["logging", "observability"]
categories = ["development-tools::debugging"]
rust-version = "1.95.0"

[dependencies]
log = { version = "0.4.33", features = ["kv"] }
logwise = { path = "..", version = "0.7.0" }
