[package]
name = "logwise_runtime_wasm"
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "structured wasm host transport for logwise"
publish = false
rust-version = "1.95.0"

[dependencies]
logwise = { path = ".." }

[features]
default = []
# Enabling this feature makes the reserved import mandatory at wasm module
# instantiation. Hosts that do not supply logwise_v1.emit leave it disabled.
host-abi = []
