[package]
name = "logwise_compat_tracing"
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Privacy-conservative tracing ingestion for logwise"
homepage = "https://sealedabstract.com/code/logwise"
repository = "https://github.com/drewcrawford/logwise"
keywords = ["logging", "tracing", "observability"]
categories = ["development-tools::debugging", "development-tools::profiling"]
rust-version = "1.95.0"

[dependencies]
logwise = { path = "..", version = "0.7.0" }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
